name: Publish Chembrain browser preview
on:
  push:
    branches: [codex/gpt-agent-workflow, main]
  workflow_dispatch:
    inputs:
      collect:
        type: boolean
        default: false
        description: Collect only public DOI and author metadata before publishing
      expected_source:
        type: string
        default: ""
        description: Optional exact commit guard for the reviewed weekly dispatcher
  schedule:
    - cron: '0 15 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: chembrain-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      facts: ${{ toJSON(steps) }}
      provenance: ${{ steps.identity.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard dispatched source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          if [ -n "$EXPECTED_SOURCE" ] && [ "$EXPECTED_SOURCE" != "$GITHUB_SHA" ]; then
            echo "Dispatch target changed after scheduler verification"
            exit 1
          fi
      - name: Record start
        env: { WEB_PHASE: dependencies }
        run: python scripts/report_web_build.py
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          npm ci
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Restore durable public DOI retry state
        if: github.event_name == 'schedule' || inputs.collect == true
        run: python scripts/paper_state.py restore --work-dir "$RUNNER_TEMP/chembrain-paper-processor"
      - name: Preserve initial replay anchors against acknowledged feed
        if: github.event_name == 'schedule' || inputs.collect == true
        run: |
          set -euo pipefail
          python -m paper_pipeline anchor --work-dir "$RUNNER_TEMP/chembrain-paper-processor" --out public/library.json
          LIBRARY_SHA=$(sha256sum public/library.json | cut -d' ' -f1)
          python scripts/paper_state.py save --work-dir "$RUNNER_TEMP/chembrain-paper-processor" --feed-ref "$GITHUB_REF" --feed-commit "$GITHUB_SHA" --library-sha256 "$LIBRARY_SHA"
      - name: Weekly separate paper processor
        id: collection
        if: github.event_name == 'schedule' || inputs.collect == true
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m paper_pipeline weekly --metadata-only --work-dir "$RUNNER_TEMP/chembrain-paper-processor" --out public/library.json
      - name: Preserve only normalized weekly data
        id: feed
        if: github.event_name == 'schedule' || inputs.collect == true
        run: |
          set -euo pipefail
          python -m paper_pipeline export --curated public/library.json --out public/library.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/library.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update compact public journal bibliography'
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum public/library.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Preserve advanced state after acknowledged feed publication
        if: success() && steps.feed.outcome == 'success'
        env:
          FEED_COMMIT: ${{ steps.feed.outputs.commit }}
          LIBRARY_SHA: ${{ steps.feed.outputs.sha256 }}
        run: python scripts/paper_state.py save --work-dir "$RUNNER_TEMP/chembrain-paper-processor" --feed-ref "$GITHUB_REF" --feed-commit "$FEED_COMMIT" --library-sha256 "$LIBRARY_SHA"
      - name: Reject source document payloads
        run: python scripts/check_repository_payloads.py
      - name: Capture actual build identity
        id: identity
        run: |
          python scripts/web_provenance.py --workflow-commit "$GITHUB_SHA" --out "$RUNNER_TEMP/web-provenance.json"
          echo "value=$(cat "$RUNNER_TEMP/web-provenance.json")" >> "$GITHUB_OUTPUT"
          echo "WEB_PROVENANCE=$(cat "$RUNNER_TEMP/web-provenance.json")" >> "$GITHUB_ENV"
      - name: Tests
        id: tests
        timeout-minutes: 4
        env: { WEB_PHASE: tests }
        run: |
          set -euo pipefail
          python scripts/report_web_build.py
          python -m pytest -q 2>&1 | tee web-tests.log
      - name: Build browser app
        id: app
        timeout-minutes: 3
        env:
          CHEMBRAIN_BASE: /${{ github.event.repository.name }}/
          WEB_PHASE: browser-build
        run: |
          set -euo pipefail
          python scripts/report_web_build.py
          npm run build:web 2>&1 | tee web-build.log
          cp "$RUNNER_TEMP/web-provenance.json" dist/version.json
      - name: Browser workflow and persistence
        id: browser
        timeout-minutes: 3
        env: { WEB_PHASE: browser-checks }
        run: |
          set -euo pipefail
          python scripts/report_web_build.py
          python scripts/web_smoke.py 2>&1 | tee web-browser.log
      - name: Reject document payloads in the Pages artifact
        run: python scripts/check_repository_payloads.py --dist dist
      - name: Build install-free browser file
        id: portable
        run: |
          set -euo pipefail
          npm run build:portable 2>&1 | tee portable-build.log
          cp release/browser-manifest.json browser-manifest.json
          python scripts/check_repository_payloads.py --dist dist-portable
          python scripts/portable_smoke.py 2>&1 | tee portable-browser.log
      - name: Save install-free browser download
        id: portable_artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chembrain-Browser-${{ github.sha }}
          path: |
            release/Chembrain.html
            release/README-Browser.txt
            release/browser-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record artifact stage
        env: { WEB_PHASE: upload-pages-artifact }
        run: python scripts/report_web_build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - name: Record validated build
        if: always()
        env:
          WEB_PHASE: build-finished
          WEB_FACTS: ${{ toJSON(steps) }}
        run: python scripts/report_web_build.py
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      WEB_PROVENANCE: ${{ needs.build.outputs.provenance }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      facts: ${{ toJSON(steps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Record configuration stage
        env: { WEB_PHASE: configure-pages }
        run: python scripts/report_web_build.py
      - name: Configure Actions-based Pages
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/ensure_pages.py | tee pages-config.log
      - name: Record deployment stage
        env: { WEB_PHASE: deploying-pages }
        run: python scripts/report_web_build.py
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify actual public HTTP
        id: access
        env: { PAGE_URL: '${{ steps.deployment.outputs.page_url }}' }
        run: |
          set -euo pipefail
          python scripts/check_published_web.py "$PAGE_URL" "$WEB_PROVENANCE" | tee web-access.log
      - name: Record publish state
        if: always()
        env:
          WEB_PHASE: publish-finished
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          WEB_FACTS: ${{ toJSON(steps) }}
        run: python scripts/report_web_build.py
  terminal:
    if: always()
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Publish authoritative preview outcome
        env:
          WEB_PROVENANCE: ${{ needs.build.outputs.provenance }}
          WEB_TERMINAL: '1'
          WEB_PHASE: terminal
          WEB_RESULT: ${{ needs.build.result == 'success' && needs.publish.result == 'success' && 'success' || 'blocked' }}
          PAGE_URL: ${{ needs.publish.outputs.page_url }}
          WEB_FACTS: ${{ toJSON(needs) }}
        run: python scripts/report_web_build.py
