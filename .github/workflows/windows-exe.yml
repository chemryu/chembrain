name: Validate Windows EXE (review candidate)
on:
  push:
    branches: [codex/chembrain-mvp, codex/gpt-agent-workflow]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chembrain-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Report build start
        shell: bash
        run: bash scripts/report_windows_build.sh running
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - id: dependencies
        name: Install locked app dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock 2>&1 | tee dependencies.log
          python -m pip install pyinstaller==6.16.0 2>&1 | tee -a dependencies.log
          npm ci 2>&1 | tee -a dependencies.log
          python -m pip install playwright==1.62.0 2>&1 | tee -a dependencies.log
          python -m playwright install chromium 2>&1 | tee -a dependencies.log
      - id: validation
        name: Build English interface and test API
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee interface.log
          python -m pytest -q 2>&1 | tee api.log
      - id: packaging
        name: Package and test the EXE
        run: |
          python -m PyInstaller packaging/chembrain.spec --noconfirm --distpath release 2>&1 | Tee-Object packaging.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\release\Chembrain.exe --smoke-test 2>&1 | Tee-Object packaged-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_desktop_launch.py --browser-ui --restricted-runtime release/Chembrain.exe 2>&1 | Tee-Object normal-launch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/README-Windows.txt release/README.txt
          Compress-Archive -Path release/Chembrain.exe,release/README.txt -DestinationPath Chembrain-Windows-x64.zip
          Get-FileHash Chembrain-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Chembrain-Windows-x64.zip" } | Set-Content SHA256SUMS.txt
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chembrain-Windows-review-candidate-${{ github.sha }}
          path: |
            Chembrain-Windows-x64.zip
            SHA256SUMS.txt
          retention-days: 30
      - name: Save build result for remote verification
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
          BUILD_STEPS: ${{ toJSON(steps) }}
        shell: bash
        run: bash scripts/report_windows_build.sh "$BUILD_RESULT"
