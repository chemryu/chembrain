name: Build Windows EXE
on:
  push:
    branches: [codex/chembrain-mvp]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chembrain-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked app dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pyinstaller==6.16.0
          npm ci
      - name: Build English interface and test API
        run: |
          npm run build
          python -m pytest -q
      - name: Package and test the EXE
        run: |
          python -m PyInstaller packaging/chembrain.spec --noconfirm --distpath release
          & .\release\Chembrain.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/README-Windows.txt release/README.txt
          Compress-Archive -Path release/Chembrain.exe,release/README.txt -DestinationPath Chembrain-Windows-x64.zip
          Get-FileHash Chembrain-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Chembrain-Windows-x64.zip" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chembrain-Windows-x64
          path: |
            release/Chembrain.exe
            release/README.txt
          retention-days: 30
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="windows-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" Chembrain-Windows-x64.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "Chembrain for Windows · build ${GITHUB_RUN_NUMBER}" --notes-file packaging/README-Windows.txt
      - name: Save build result for remote verification
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build-status"
          cd "$RUNNER_TEMP/build-status"
          git init -b build/windows-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '{"status":"%s","commit":"%s","run_url":"https://github.com/%s/actions/runs/%s","release_url":"https://github.com/%s/releases/tag/windows-%s"}\n' "$BUILD_RESULT" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" > status.json
          git add status.json
          git commit -m "Windows build ${GITHUB_RUN_NUMBER}: ${BUILD_RESULT}"
          git -C "$GITHUB_WORKSPACE" fetch "$RUNNER_TEMP/build-status" build/windows-status
          git -C "$GITHUB_WORKSPACE" push origin FETCH_HEAD:refs/heads/build/windows-status --force
